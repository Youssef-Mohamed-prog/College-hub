<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مجمع طلاب BIS</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="shortcut icon" type="image/svg+xml" href="assets/icons/logo.svg">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card" data-animate="fadeInUp">
      <div class="login-header">
        <div class="brand-logo">
          <img src="assets/icons/logo.svg" alt="مجمع طلاب BIS" width="48" height="48">
        </div>
        <h1>مجمع طلاب <span class="gradient-text">BIS</span></h1>
        <p>سجل دخولك لمتابعة رحلتك التعليمية</p>
      </div>
      
      <div class="login-form">
        <div class="input-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@bis.edu.eg" autocomplete="email">
        </div>
        
        <div class="input-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        
        <button id="loginBtn" class="btn btn-primary btn-block login-btn">
          تسجيل الدخول
          <span class="btn-icon">←</span>
        </button>

        <p class="auth-switch">معندكش حساب؟ <a href="signup.html">إنشاء حساب جديد</a></p>
        
        <div id="msg" class="login-msg"></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
