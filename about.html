<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجمع طلاب BIS</title>
    <meta name="description" content="منصة تعليمية لطلاب نظم المعلومات الإدارية (BIS): محاضرات مرتبة وملخص لكل محاضرة، لكل مواد الدفعة في مكان واحد.">
    <meta property="og:description" content="منصة تعليمية لطلاب نظم المعلومات الإدارية (BIS): محاضرات مرتبة وملخص لكل محاضرة، لكل مواد الدفعة في مكان واحد.">
    <meta name="twitter:description" content="منصة تعليمية لطلاب نظم المعلومات الإدارية (BIS): محاضرات مرتبة وملخص لكل محاضرة، لكل مواد الدفعة في مكان واحد.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#4F46E5">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
    <link rel="modulepreload" href="js/firebase.js">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar" id="navbar"></header>

    <!-- Page Content -->
    <main class="page-content page-enter" id="aboutContent">
        <!-- Rendered by JS below -->
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <!-- Scripts -->
    <script src="js/config.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/chatbot.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('aboutContent');
            if (!container) return;

            container.innerHTML = `
                <!-- About Hero -->
                <section class="about-hero">
                    <div class="container">
                        <h1 class="animate-fade-in-up">${aboutContent.hero.title}</h1>
                        <p class="animate-fade-in-up" style="animation-delay: 0.2s">${aboutContent.hero.subtitle}</p>
                    </div>
                </section>

                <!-- About Sections -->
                <section class="about-section">
                    <div class="container">
                        <!-- Mission -->
                        <div class="about-block" data-animate="fadeInUp">
                            <h2>${aboutContent.mission.title}</h2>
                            <p>${aboutContent.mission.text}</p>
                        </div>

                        <!-- What We Offer -->
                        <div class="about-block" data-animate="fadeInUp">
                            <h2>${aboutContent.offering.title}</h2>
                            <div class="about-offerings">
                                ${aboutContent.offering.items.map(item => `
                                    <div class="offering-card" data-animate="fadeInUp">
                                        <div class="offering-icon">${item.icon}</div>
                                        <h3>${item.title}</h3>
                                        <p>${item.text}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Why -->
                        <div class="about-block" data-animate="fadeInUp">
                            <h2>${aboutContent.why.title}</h2>
                            <p>${aboutContent.why.text}</p>
                        </div>

                        <!-- Philosophy -->
                        <div class="about-block" data-animate="fadeInUp">
                            <h2>${aboutContent.philosophy.title}</h2>
                            <p>${aboutContent.philosophy.text}</p>
                        </div>
                    </div>
                </section>

                <!-- CTA -->
                <section class="cta-section">
                    <div class="container">
                        <div class="cta-box">
                            <h2>ابدأ رحلتك التعليمية الآن</h2>
                            <p>استكشف المواد المتاحة وابدأ التعلّم مع أفضل المدرسين.</p>
                            <a href="courses.html" class="btn btn-cta btn-lg">استعرض المواد <svg class="arrow-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="17" y1="17" x2="7" y2="7"></line><polyline points="7 17 7 7 17 7"></polyline></svg></a>
                        </div>
                    </div>
                </section>
            `;
        });
    </script>
    <script type="module" src="js/guard.js"></script>
</body>

</html>
