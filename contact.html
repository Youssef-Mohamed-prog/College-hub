<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تواصل مع مجمع طلاب BIS نسعد بتواصلكم واستفساراتكم.">
    <title>مجمع طلاب BIS</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
    <link rel="modulepreload" href="js/firebase.js">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar" id="navbar"></header>

    <!-- Page Content -->
    <main class="page-content page-enter" id="contactContent">
        <!-- Rendered by JS below -->
    </main>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <!-- Scripts -->
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('contactContent');
            if (!container) return;

            container.innerHTML = `
                <!-- Contact Hero -->
                <section class="contact-hero">
                    <div class="container">
                        <h1 class="animate-fade-in-up">تواصل معنا</h1>
                        <p class="animate-fade-in-up" style="animation-delay: 0.2s">نسعد بتواصلك أرسل لنا استفسارك وسنرد عليك في أقرب وقت</p>
                    </div>
                </section>

                <!-- Contact Layout -->
                <section>
                    <div class="container">
                        <div class="contact-layout">
                            <!-- Contact Info -->
                            <div class="contact-info animate-fade-in-up">
                                <div class="contact-info-card">
                                    <div class="contact-info-icon">📧</div>
                                    <div class="contact-info-text">
                                        <h3>البريد الإلكتروني</h3>
                                        <a href="mailto:dev.youssef.moham3d@gmail.com" onclick="if(!/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)){ window.open('https://mail.google.com/mail/?view=cm&fs=1&to=dev.youssef.moham3d@gmail.com', '_blank'); return false; }">dev.youssef.moham3d@gmail.com</a>
                                    </div>
                                </div>
                                <div class="contact-info-card">
                                    <div class="contact-info-icon">📱</div>
                                    <div class="contact-info-text">
                                        <h3>الهاتف</h3>
                                        <a href="tel:01030748981" dir="ltr">01030748981</a>
                                    </div>
                                </div>
                                <div class="contact-info-card">
                                    <div class="contact-info-icon">📢</div>
                                    <div class="contact-info-text">
                                        <h3>قناتنا</h3>
                                        <p>💙لو مهتم بالـ Tech والفرص التدريبية المجانية، تابعنا وتطوير الذات عشان يوصلك كل جديد!</p>
                                        <div style="display: flex; gap: var(--space-sm); margin-top: var(--space-sm);">
                                            <a href="https://whatsapp.com/channel/0029Vb8AcJy4SpkPpRb16o00" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">واتساب</a>
                                            <a href="https://t.me/kVKL9JUTn9w2NzY0" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">تيليجرام</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="contact-info-card">
                                    <div class="contact-info-icon">💬</div>
                                    <div class="contact-info-text">
                                        <h3>جروب الواتساب</h3>
                                        <p>لمتابعة جديد المحاضرات والملخصات، انضم لجروب الواتساب.</p>
                                        <div style="margin-top: var(--space-sm);">
                                            <a href="${siteConfig.social.whatsappGroup}" target="_blank" rel="noopener noreferrer" class="btn btn-cta btn-sm">انضم للجروب</a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Contact Form -->
                            <div class="contact-form-wrapper animate-fade-in-up" style="animation-delay: 0.2s">
                                <h2>أرسل لنا رسالة</h2>
                                <form id="contactForm">
                                    <div class="form-group">
                                        <label for="contact-name">الاسم الكامل</label>
                                        <input type="text" id="contact-name" placeholder="أدخل اسمك الكامل" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="contact-email">البريد الإلكتروني</label>
                                        <input type="email" id="contact-email" placeholder="example@email.com" required dir="ltr" style="text-align: right;">
                                    </div>
                                    <div class="form-group">
                                        <label for="contact-subject">الموضوع</label>
                                        <select id="contact-subject" required>
                                            <option value="" disabled selected>اختر الموضوع</option>
                                            <option value="suggestion">اقتراح</option>
                                            <option value="issue">مشكلة في ملف أو فيديو</option>
                                            <option value="request">طلب مادة أو ملخص</option>
                                            <option value="share">مشاركة ملخص</option>
                                            <option value="other">أخرى</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="contact-message">الرسالة</label>
                                        <textarea id="contact-message" placeholder="اكتب رسالتك هنا..." rows="5" required></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-cta btn-lg" style="width: 100%;" id="submitBtn">
                                        إرسال الرسالة ←
                                    </button>
                                </form>
                                <div class="form-success" id="formSuccess">
                                    <div class="success-icon">✅</div>
                                    <h3>تم الإرسال بنجاح!</h3>
                                    <p>هذا نموذج تجريبي في النسخة النهائية سيتم إرسال الرسالة فعليًا عبر Backend أو خدمة مثل Supabase.</p>
                                    <button class="btn btn-outline mt-lg" onclick="resetForm()">إرسال رسالة أخرى</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `;

            // Form handling
            const form = document.getElementById('contactForm');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();

                    // Hide form, show success
                    form.style.display = 'none';
                    document.getElementById('formSuccess').classList.add('show');
                });
            }
        });

        function resetForm() {
            const form = document.getElementById('contactForm');
            const success = document.getElementById('formSuccess');
            if (form && success) {
                form.reset();
                form.style.display = 'block';
                success.classList.remove('show');
            }
        }
    </script>
    <script type="module" src="js/guard.js"></script>
</body>

</html>
